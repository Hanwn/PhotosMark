<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="%BASE_URL%favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="纯前端照片水印工具，在浏览器中处理和导出照片。">
    <title>PhotosMark - 照片水印工具</title>
    <script>
      try {
        const savedMode = localStorage.getItem("photosmark-theme");
        document.documentElement.dataset.theme = savedMode === "light" || savedMode === "dark"
          ? savedMode
          : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
